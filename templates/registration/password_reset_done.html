{% extends '_base.html' %}

{% block page_title %}Ybook | ایمیل ارسال شد{% endblock %}

{% block content %}
<div class="status-page">
    <div class="status-card animate-fade-in">
        <div class="status-icon status-icon-success">
            <i class="bi bi-envelope-check"></i>
        </div>
        <h2 class="status-title">ایمیل ارسال شد!</h2>
        <p class="status-text">
            لینک بازیابی رمز عبور به ایمیل شما ارسال شد.<br>
            لطفاً صندوق پستی خود را بررسی کنید.
        </p>
        <a href="{% url 'login' %}" class="status-btn status-btn-primary">
            <i class="bi bi-box-arrow-in-left"></i>بازگشت به ورود
        </a>
    </div>
</div>
{% endblock %}
