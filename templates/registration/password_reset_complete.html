{% extends '_base.html' %}

{% block page_title %}Ybook | بازیابی موفق{% endblock %}

{% block content %}
<div class="status-page">
    <div class="status-card animate-fade-in">
        <div class="status-icon status-icon-success">
            <i class="bi bi-check-circle"></i>
        </div>
        <h2 class="status-title">بازیابی رمز موفق!</h2>
        <p class="status-text">
            رمز عبور شما با موفقیت تغییر کرد.<br>
            اکنون می‌توانید با رمز جدید وارد شوید.
        </p>
        <a href="{% url 'login' %}" class="status-btn status-btn-primary">
            <i class="bi bi-box-arrow-in-left"></i>ورود به حساب
        </a>
    </div>
</div>
{% endblock %}
