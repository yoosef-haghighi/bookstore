{% extends '_base.html' %}
{% load crispy_forms_tags %}

{% block page_title %}کتاب یار | بازیابی رمز عبور{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card animate-fade-in">
        <div class="auth-icon" style="background: linear-gradient(135deg, #FDCB6E, #F39C12);">
            <i class="bi bi-key"></i>
        </div>
        <h1 class="auth-title">بازیابی رمز عبور</h1>
        <p class="auth-subtitle">ایمیل خود را وارد کنید تا لینک بازیابی رمز برایتان ارسال شود</p>

        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="auth-btn auth-btn-primary mt-3">
                <i class="bi bi-send me-1"></i>ارسال لینک بازیابی
            </button>
        </form>

        <div class="auth-link">
            <a href="{% url 'login' %}"><i class="bi bi-arrow-right me-1"></i>بازگشت به ورود</a>
        </div>
    </div>
</div>
{% endblock %}
