{% extends '_base.html' %}
{% load crispy_forms_tags %}

{% block page_title %}Ybook | تغییر رمز عبور{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card animate-fade-in">
        <div class="auth-icon" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark));">
            <i class="bi bi-key"></i>
        </div>
        <h1 class="auth-title">تغییر رمز عبور</h1>
        <p class="auth-subtitle">رمز عبور فعلی و جدید خود را وارد کنید</p>

        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="auth-btn auth-btn-primary mt-3">
                <i class="bi bi-check-lg me-1"></i>تغییر رمز
            </button>
        </form>
    </div>
</div>
{% endblock %}
