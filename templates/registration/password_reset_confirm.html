{% extends '_base.html' %}
{% load crispy_forms_tags %}

{% block page_title %}کتاب یار | تنظیم رمز جدید{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card animate-fade-in">
        <div class="auth-icon" style="background: linear-gradient(135deg, var(--accent), #00A381);">
            <i class="bi bi-shield-lock"></i>
        </div>
        <h1 class="auth-title">رمز عبور جدید</h1>
        <p class="auth-subtitle">رمز عبور جدید خود را وارد کنید</p>

        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="auth-btn auth-btn-success mt-3">
                <i class="bi bi-check-lg me-1"></i>ذخیره رمز جدید
            </button>
        </form>
    </div>
</div>
{% endblock %}
